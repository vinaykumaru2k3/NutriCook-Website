<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Test</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .test-section { height: 100vh; padding: 2rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .test-section:nth-child(odd) { background: #f0f0f0; }
        .test-section:nth-child(even) { background: #e0e0e0; }
    </style>
</head>
<body>
    <div id="home" class="test-section">Home Section</div>
    <div id="why-nutricook" class="test-section">Why NutriCook Section</div>
    <div id="products" class="test-section">Products Section</div>
    <div id="dealer" class="test-section">Dealer Section</div>
    <div id="contact" class="test-section">Contact Section</div>
    
    <script>
        // Test smooth scrolling functionality
        function testScrollToSection(sectionId, offset = 80) {
            const element = document.getElementById(sectionId);
            if (element) {
                const elementTop = element.offsetTop - offset;
                window.scrollTo({
                    top: elementTop,
                    behavior: 'smooth'
                });
                console.log(`Scrolled to ${sectionId}`);
            }
        }
        
        // Test active section detection
        function testGetActiveSection(sections, offset = 100) {
            const scrollPosition = window.scrollY + offset;
            for (let i = sections.length - 1; i >= 0; i--) {
                const section = document.getElementById(sections[i]);
                if (section && section.offsetTop <= scrollPosition) {
                    console.log(`Active section: ${sections[i]}`);
                    return sections[i];
                }
            }
            return sections[0];
        }
        
        // Test keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                if (e.target.tagName === 'BUTTON') {
                    console.log('Keyboard navigation triggered');
                }
            }
        });
        
        // Test scroll event
        window.addEventListener('scroll', () => {
            const sections = ['home', 'why-nutricook', 'products', 'dealer', 'contact'];
            testGetActiveSection(sections);
        });
        
        console.log('Navigation test page loaded successfully');
        console.log('Test functions available: testScrollToSection(), testGetActiveSection()');
    </script>
</body>
</html>
